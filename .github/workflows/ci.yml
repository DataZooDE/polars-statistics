name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  type-check:
    name: Type Stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin numpy polars pytest scipy statsmodels 'mypy==1.11.2'

      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop --release

      # TYPE-03: fail if the checked-in stubs drift from the runtime API.
      - name: Verify stubs are in sync with runtime API
        run: |
          source .venv/bin/activate
          pytest tests/test_type_stubs.py -v

      # TYPE-03: fail if regenerating the stubs would produce a different file.
      - name: Verify generated stubs are up to date
        run: |
          source .venv/bin/activate
          python scripts/gen_stubs.py
          git diff --exit-code python/polars_statistics/_polars_statistics.pyi

      # TYPE-01/02: the public API type-checks clean under mypy.
      - name: mypy public API smoke check
        run: |
          source .venv/bin/activate
          cat > /tmp/type_smoke.py <<'PY'
          import numpy as np
          import polars as pl
          import polars_statistics as ps
          from polars_statistics import OLS

          m = OLS(with_intercept=True)
          m.fit(np.zeros((3, 1)), np.zeros(3))
          coefs: np.ndarray = m.coefficients
          r2: float = m.r_squared
          summary: str = m.summary()

          e: pl.Expr = ps.ols("y", "x1", "x2")
          t: pl.Expr = ps.ttest_ind("a", "b")
          PY
          mypy --python-version 3.10 --ignore-missing-imports /tmp/type_smoke.py
          mypy --python-version 3.10 --ignore-missing-imports \
            python/polars_statistics/exprs python/polars_statistics/formula \
            python/polars_statistics/_polars_statistics.pyi

  test-python:
    name: Python Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin numpy polars pytest scipy statsmodels

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install maturin numpy polars pytest scipy statsmodels
        shell: cmd

      - name: Build and install (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Build and install (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\activate
          maturin develop --release
        shell: cmd

      - name: Run Python tests (Unix)
        if: runner.os != 'Windows'
        run: |
          source .venv/bin/activate
          pytest tests/ -v

      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\activate
          pytest tests/ -v
        shell: cmd

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin numpy polars pytest pytest-cov scipy statsmodels

      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ --cov=polars_statistics --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
